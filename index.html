<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pageTitle">图压 TinyPress · 图片压缩到指定大小</title>
  <meta name="description" content="纯前端图片压缩工具：上传图片，把文件压缩到目标大小区间内（如 100KB / 500KB / 1MB），图片不会上传到任何服务器。" />
  <link rel="icon" type="image/svg+xml" href="icons/brandmark.svg" />
  <link rel="manifest" href="manifest.webmanifest?v=2" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-icon">
          <img src="icons/brandmark.svg" width="30" height="30" alt="" aria-hidden="true" />
        </div>
        <div>
          <h1>图压 <span class="brand-sub">TinyPress</span></h1>
          <p class="tagline" data-i18n="tagline">简单快捷的图片压缩工具</p>
        </div>
      </div>
      <div class="header-actions">
        <p class="privacy-note" data-i18n="privacy">纯本地处理</p>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="zh" data-i18n="langZh">中</button>
          <button type="button" class="lang-btn" data-lang="en" data-i18n="langEn">EN</button>
        </div>
        <button type="button" class="btn-ghost header-feedback" id="feedbackBtn" data-i18n="feedback">反馈</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 上传区 -->
    <section class="card drop-card" id="dropzone" tabindex="0" role="button" data-i18n-aria="dropAria">
      <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple hidden />
      <div class="drop-inner">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </div>
        <p class="drop-title" data-i18n="dropTitle">点击选择图片，拖拽或粘贴上传</p>
        <p class="drop-hint" data-i18n="dropHint">支持 JPG / PNG / WebP / AVIF / GIF / HEIC，可一次选择多张</p>
      </div>
    </section>

    <!-- 设置区 -->
    <section class="card settings-card">
      <div class="settings-row">
        <div class="setting-group">
          <label class="setting-label" data-i18n="targetLabel">目标大小</label>
          <div class="preset-btns" id="presetBtns">
            <button type="button" class="preset" data-kb="200">200KB</button>
            <button type="button" class="preset" data-kb="500">500KB</button>
            <button type="button" class="preset active" data-kb="1024">1MB</button>
            <button type="button" class="preset" data-kb="2048">2MB</button>
            <button type="button" class="preset" data-kb="5120">5MB</button>
            <button type="button" class="preset" data-kb="10240">10MB</button>
            <button type="button" class="preset" data-kb="25600">25MB</button>
            <button type="button" class="preset convert-preset" data-kb="-1" data-i18n="convertOnly">仅转换</button>
          </div>
          <div class="custom-size" id="customWrap" role="button" tabindex="0" data-i18n-aria="customAria">
            <input type="number" id="customSize" min="10" max="102400" data-i18n-ph="customPh" placeholder="自定义" />
            <span class="unit">KB</span>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label" data-i18n="formatLabel">输出格式</label>
          <div class="preset-btns" id="formatBtns">
            <button type="button" class="preset active" data-format="auto">自动</button>
            <button type="button" class="preset" data-format="jpeg">JPEG</button>
            <button type="button" class="preset" data-format="webp">WebP</button>
            <button type="button" class="preset" data-format="avif">AVIF</button>
            <button type="button" class="preset" data-format="png">PNG</button>
          </div>
          <p class="setting-note" id="formatNote" data-i18n="fmtAuto">自动：默认保持原格式，无法处理会按照 WebP → AVIF / JPEG 降级。</p>
        </div>
      </div>

      <!-- 已选文件列表 -->
      <div class="file-list" id="fileList"></div>
      <p class="selected-info" id="selectedInfo"></p>

      <!-- 压缩按钮 -->
      <button type="button" class="btn-compress" id="compressBtn" disabled data-i18n="compress">压缩</button>
    </section>

    <!-- 结果区 -->
    <section class="results" id="results" hidden>
      <div class="results-head">
        <h2 data-i18n="resultsTitle">压缩结果</h2>
        <div class="results-actions">
          <button type="button" class="btn-ghost" id="downloadAll" disabled data-i18n="downloadAll">打包下载</button>
          <button type="button" class="btn-ghost" id="clearAll" data-i18n="clearAll">清空</button>
        </div>
      </div>
      <div class="result-grid" id="resultGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer">图压 TinyPress · 免费开源工具 · 图片仅在本地浏览器中处理，绝不上传</p>
    </div>
  </footer>

  <!-- 反馈弹窗 -->
  <div class="modal-overlay" id="feedbackModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
      <h3 id="feedbackTitle" data-i18n="fbTitle">提交反馈</h3>
      <p class="modal-hint" data-i18n="fbHint">反馈将以公开 Issue 发布到 GitHub，请勿填写敏感信息。</p>
      <textarea id="feedbackText" rows="4" maxlength="2000" data-i18n-ph="fbPlaceholder" placeholder="遇到了什么问题？或有什么建议？"></textarea>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="feedbackCancel" data-i18n="fbCancel">取消</button>
        <button type="button" class="btn-primary" id="feedbackSubmit" data-i18n="fbSubmit">提交</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js?v=19"></script>
</body>
</html>
